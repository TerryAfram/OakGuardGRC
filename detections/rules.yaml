detection_rules:
  - id: DET-001
    name: "Kubernetes Unauthorized Privilege Escalation"
    severity: "High"
    framework_mapping:
      - "SOC 2: CC6.1"
      - "ISO 27001: A.12.1.1"
    query_logic: "audit_log.verb == 'create' AND audit_log.objectRef.resource == 'clusterrolebindings'"
    action: "Trigger automated incident triage playbook"

  - id: DET-002
    name: "Agent Workload Control Drift"
    severity: "Medium"
    framework_mapping:
      - "NIST SP 800-53: CM-3"
    query_logic: "telemetry.status == 'config_drift_detected'"
    action: "Alert security operations team"
