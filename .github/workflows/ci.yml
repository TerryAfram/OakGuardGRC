name: GRC & Detection CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest

      - name: Set up Kind Cluster
        uses: engineerd/setup-kind@v5
        with:
          version: 'v0.22.0'

      - name: Verify Cluster
        run: kubectl cluster-info

      - name: Build Docker Image & Load into Kind
        run: |
          docker build -t grc-app:latest .
          kind load docker-image grc-app:latest

      - name: Deploy Manifests
        run: |
          kubectl apply -f k8s/
          kubectl get pods -A
